<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background (Pi Browser icon style) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#glow)"/>

  <!-- Paw print, centered -->
  <g fill="#ffffff" transform="translate(512 512)">
    <!-- Main pad -->
    <path d="M 0,150
             C -130,150 -200,80 -200,0
             C -200,-90 -110,-150 0,-150
             C 110,-150 200,-90 200,0
             C 200,80 130,150 0,150 Z"/>
    <!-- Four toe beans -->
    <ellipse cx="-160" cy="-220" rx="62" ry="80"/>
    <ellipse cx="-55"  cy="-285" rx="62" ry="80"/>
    <ellipse cx="55"   cy="-285" rx="62" ry="80"/>
    <ellipse cx="160"  cy="-220" rx="62" ry="80"/>
  </g>

  <!-- Pi symbol cut INTO the main pad (negative space) -->
  <g fill="#6d28d9" transform="translate(512 512)" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="200" text-anchor="middle">
    <text y="60">π</text>
  </g>
</svg>
